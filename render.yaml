services:
  - type: web
    name: fuelsync-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: OPINET_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
