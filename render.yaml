services:
  - type: web
    name: fuelsync-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /error
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPINET_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
